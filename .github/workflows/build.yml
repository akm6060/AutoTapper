name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        id: find
        run: |
          S=$(find . -name settings.gradle -not -path "*/node_modules/*" | head -1)
          if [ -z "$S" ]; then echo "settings.gradle not found - upload the project files"; exit 1; fi
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle --no-daemon -p "${{ steps.find.outputs.dir }}" assembleDebug

      - name: Name the APK
        run: cp "${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" AutoTapper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoTapper-apk
          path: AutoTapper.apk

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoTapper.apk
