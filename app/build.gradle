plugins { id 'com.android.application' }

android {
    namespace 'com.autotapper.clicker'
    compileSdk 35
    defaultConfig {
        applicationId "com.autotapper.clicker"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }
    signingConfigs {
        // fixed throw-away key so every CI build can update the previous install
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
